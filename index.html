<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__APP_NAME__</title>
<link rel="icon" href="/logo.svg">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frostbyte">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rail:#0b1322;--side:#111d33;--chat:#17253e;--input:#1f3050;--hover:#1d2c47;--active:#26395a;--text:#dfeaf8;--head:#f3f9ff;--muted:#8aa0bf;--accent:#3d8bff;--green:#2fbf71;--red:#e5484d;--yellow:#f0b232}
html,body{height:100%}
body{font-family:"gg sans","Noto Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--chat);color:var(--text);font-size:15px;overflow:hidden}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a3a55;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
.muted{color:var(--muted)}.small{font-size:13px}.pad{padding:8px}
/* Login */
.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 120%,rgba(120,200,255,.35),transparent 55%),radial-gradient(circle at 15% 15%,rgba(61,139,255,.35),transparent 40%),linear-gradient(180deg,#060b16 0%,#0d1a33 60%,#16305a 100%)}
.auth:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-40px;height:120px;background:#eaf5ff;border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.9;box-shadow:0 -10px 40px rgba(200,230,255,.4)}
.card{position:relative;z-index:22;background:rgba(23,37,62,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(160,210,255,.18);padding:32px;border-radius:14px;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.5);text-align:center}
.card .logo img{width:84px;height:84px;filter:drop-shadow(0 6px 18px rgba(79,157,255,.55))}
.card .brand{font-size:30px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#bff0ff,#6fb3ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:4px}
.card h1{color:var(--head);font-size:20px;margin:8px 0 4px}
.card .sub{color:var(--muted);margin-bottom:12px}
.card label,.box label{display:block;text-align:left;font-size:12px;font-weight:700;color:#a9bcd6;margin:14px 0 6px;letter-spacing:.02em;text-transform:uppercase}
.card input,.box input,.box textarea{width:100%;background:#0d1626;border:0;border-radius:4px;padding:10px;outline:none;font-size:15px}
.box textarea{resize:vertical}
.card .switch{margin-top:14px;text-align:left;color:var(--muted);font-size:14px}
.card .switch a{color:#00a8fc;text-decoration:none}
.card .hint{margin-top:16px;font-size:12px;color:var(--muted)}
.btn{padding:9px 16px;border-radius:4px;font-weight:600;color:#fff;background:#33476a;transition:filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.big{width:100%;margin-top:20px;padding:12px;font-size:16px}
.btn.small{padding:5px 10px;font-size:13px}
.err{color:#fa777c;font-size:14px;margin-top:8px;min-height:18px;text-align:left}
/* Layout */
#app{display:flex;height:100vh;height:100dvh}
#rail{width:72px;background:var(--rail);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;overflow-y:auto;flex-shrink:0;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.rail-item{position:relative;width:72px;display:flex;justify-content:center;cursor:pointer;flex-shrink:0}
.rail-item .icon{width:48px;height:48px;border-radius:50%;background:var(--chat);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--head);transition:border-radius .15s,background .15s;font-size:17px;user-select:none}
.rail-item:hover .icon,.rail-item.active .icon{border-radius:16px;background:var(--accent);color:#fff}
.rail-item.add .icon{color:var(--green);font-size:26px;font-weight:400}.rail-item.add:hover .icon{background:var(--green);color:#fff}
.rail-item.adm .icon{font-size:22px}.rail-item.adm:hover .icon{background:var(--yellow)}
.rail-item .pill{position:absolute;left:0;top:50%;width:4px;height:0;background:#fff;border-radius:0 4px 4px 0;transform:translateY(-50%);transition:height .15s}
.rail-item.unread .pill{height:8px}.rail-item:hover .pill{height:20px}.rail-item.active .pill{height:40px}
.rail-item .badge{position:absolute;bottom:-3px;right:9px;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:0 5px;min-width:18px;height:18px;line-height:18px;text-align:center;border:3px solid var(--rail);box-sizing:content-box}
.rail-sep{width:32px;height:2px;background:#22314b;border-radius:1px;flex-shrink:0}
#side{width:240px;background:var(--side);display:flex;flex-direction:column;flex-shrink:0}
.side-head{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;color:var(--head);border-bottom:1px solid #0e1829;flex-shrink:0}
.side-head.click{cursor:pointer}.side-head.click:hover{background:var(--hover)}
.side-head .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chanList{flex:1;overflow-y:auto;padding:8px}
.cat{display:flex;justify-content:space-between;align-items:center;padding:16px 8px 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.cat button{font-size:20px;line-height:1;color:var(--muted)}.cat button:hover{color:var(--head)}
.chan{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;color:var(--muted);cursor:pointer;margin:1px 0;font-weight:500}
.chan:hover{background:var(--hover);color:var(--text)}
.chan.active{background:var(--active);color:#fff}
.chan.unread{color:#fff;font-weight:700}
.chan .hash{font-size:20px;opacity:.7;width:18px;text-align:center}
.chan .hash.emo{font-size:16px;width:24px;opacity:1}
.chan .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan .cnt{background:var(--red);color:#fff;border-radius:8px;font-size:12px;padding:0 6px;font-weight:700}
.dmrow{padding:5px 8px}
.newdm{width:100%;text-align:left;padding:8px;border-radius:4px;color:var(--muted);font-weight:600}.newdm:hover{background:var(--hover);color:var(--text)}
#userPanel{height:52px;background:#101a2c;display:flex;align-items:center;gap:8px;padding:0 8px;flex-shrink:0}
#userPanel .up{flex:1;min-width:0}
#userPanel .nm{font-weight:600;color:var(--head);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;user-select:none;text-transform:uppercase}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:38%;height:38%;border-radius:50%;border:3px solid var(--side);background:#6f84a3}
.av .dot.on{background:var(--green)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat);position:relative}
.chat-head{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid #101b2e;flex-shrink:0}
.chat-head .title{font-weight:600;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .hash{font-size:22px;color:var(--muted)}
.dot-inline{width:10px;height:10px;border-radius:50%;background:#6f84a3}.dot-inline.on{background:var(--green)}
.iconbtn{width:34px;height:34px;border-radius:4px;color:#a9bcd6;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:hover{color:var(--head);background:var(--hover)}
.mobile-only{display:none}
.conn{background:var(--red);color:#fff;text-align:center;font-size:13px;padding:4px}
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 0 8px}
.welcome{padding:16px 16px 20px}
.welcome .wicon{width:68px;height:68px;border-radius:50%;background:#2a3d5e;font-size:40px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:8px}
.welcome .av{margin-bottom:8px}
.welcome h2{color:var(--head);font-size:28px;margin-bottom:4px;word-break:break-word}
.welcome p{color:var(--muted)}
.loading{padding:16px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;text-align:center;padding:24px;color:var(--muted)}
.empty-icon{font-size:56px}.empty h3{color:var(--head)}
.daysep{display:flex;align-items:center;margin:20px 16px 4px;color:var(--muted);font-size:12px;font-weight:600}
.daysep:before,.daysep:after{content:"";flex:1;height:1px;background:#2a3a55}
.daysep span{padding:0 8px}
.msg{position:relative;padding:2px 56px 2px 72px;margin-top:14px;min-height:44px}
.msg.grouped{margin-top:0;min-height:0}
.msg:hover,.msg.sel{background:#1f2e48}
.msg.mentioned{background:rgba(240,178,50,.08);box-shadow:inset 2px 0 0 var(--yellow)}
.msg>.av{position:absolute;left:16px;top:4px;cursor:pointer}
.mhead{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.mname{font-weight:600;cursor:pointer}.mname:hover{text-decoration:underline}
.mtime{font-size:12px;color:var(--muted)}
.gtime{position:absolute;left:0;width:62px;text-align:right;font-size:11px;color:var(--muted);top:5px;opacity:0}
.msg:hover .gtime{opacity:1}
.mtext{line-height:1.375;overflow-wrap:anywhere;color:var(--text)}
.mtext a{color:#00a8fc;text-decoration:none}.mtext a:hover{text-decoration:underline}
.mtext code{background:#14213a;padding:1px 4px;border-radius:4px;font-family:Consolas,monospace;font-size:85%}
.mention{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 2px;font-weight:500}
.mention.me{background:rgba(240,178,50,.3);color:var(--yellow)}
.edited{font-size:11px;color:var(--muted)}
.mimg{display:block;max-width:min(400px,100%);max-height:320px;border-radius:8px;margin-top:6px;cursor:zoom-in}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.react{background:#14213a;border:1px solid transparent;border-radius:8px;padding:2px 6px;font-size:14px;color:#a9bcd6}
.react:hover{border-color:#33476a}.react.mine{background:rgba(88,101,242,.15);border-color:var(--accent);color:#dee0fc}
.mact{position:absolute;right:16px;top:-16px;display:none;background:var(--chat);border:1px solid #101b2e;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2;overflow:hidden}
.msg:hover .mact,.msg.sel .mact{display:flex}
.mact button{width:32px;height:32px;font-size:16px}.mact button:hover{background:var(--hover)}
.badge-role{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff;text-transform:uppercase;align-self:center;letter-spacing:.03em;white-space:nowrap}
.badge-role.owner{background:var(--yellow);color:#0d1626}.badge-role.admin{background:var(--red)}.badge-role.ban{background:#33476a}
.editbox textarea{width:100%;background:var(--input);border:0;border-radius:6px;padding:10px;outline:none;resize:none;margin-top:4px}
.editbox small{color:var(--muted);font-size:12px}
.composer-wrap{padding:0 16px}
.composer{display:flex;align-items:flex-end;gap:2px;background:var(--input);border-radius:8px;padding:2px 6px}
.preview:not(.hidden)+.composer{border-radius:0 0 8px 8px}
.composer textarea{flex:1;background:transparent;border:0;outline:none;resize:none;padding:11px 4px;max-height:200px;line-height:1.375;min-width:0}
.composer .iconbtn{width:40px;height:42px;font-size:20px}
.preview{background:#14213a;border-radius:8px 8px 0 0;padding:10px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #0e1829}
.preview img{max-height:120px;max-width:200px;border-radius:6px}
#typing{height:26px;padding:0 16px;font-size:13px;color:#a9bcd6;display:flex;align-items:center;gap:6px}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:#a9bcd6;animation:blink 1.4s infinite both}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
#members{width:240px;background:var(--side);overflow-y:auto;padding:8px;flex-shrink:0}
.mem{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px;cursor:pointer}
.mem:hover{background:var(--hover)}
.mem.off{opacity:.4}.mem.off:hover{opacity:1}
.mem .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.mini-prof{background:#101a2c;border-radius:8px;overflow:hidden;padding:0 12px 12px}
.mini-prof .prof-banner{margin:0 -12px}
.mini-prof h3{color:var(--head);margin:6px 0 4px}
.mini-prof p{margin-top:8px;font-size:14px;overflow-wrap:anywhere}
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--chat);border-radius:8px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;padding:20px;animation:pop .15s;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.box.wide{max-width:720px}
.box.imgview{max-width:none;width:auto;background:transparent;box-shadow:none;padding:0}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.mtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.mtitle h2{color:var(--head);font-size:20px;overflow-wrap:anywhere}
.x{font-size:18px;color:var(--muted);padding:4px 8px}.x:hover{color:var(--head)}
.box h3{color:var(--head);font-size:15px;margin:16px 0 6px}
.box p{color:#a9bcd6;line-height:1.4}
.box hr{border:0;border-top:1px solid #2a3a55;margin:18px 0}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row>input{flex:1;min-width:120px}
.or{text-align:center;color:var(--muted);font-size:12px;font-weight:700;margin:18px 0 4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent}.sw.sel{border-color:#fff}
.box input.colorpick{width:40px;height:36px;padding:2px;cursor:pointer}
.code{font-family:Consolas,monospace;font-size:22px;letter-spacing:3px;background:#0d1626;padding:10px 14px;border-radius:6px;color:var(--head);flex:1;text-align:center;user-select:all}
.list-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;flex-wrap:wrap}
.list-item:hover{background:var(--hover)}
.list-item.click{cursor:pointer}
.list-item .nm{font-weight:600;color:var(--head);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.list-item .acts{display:flex;gap:6px;flex-wrap:wrap}
.list-item .hash{color:var(--muted);font-size:20px}
.ulist{margin-top:10px;max-height:50vh;overflow-y:auto}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:#14213a;border-radius:8px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--head)}
.prof-banner{height:64px;margin:-20px -20px 0}
.prof-av{margin-top:-34px;border:6px solid var(--chat);box-sizing:content-box}
.mini-prof .prof-av{border-color:#101a2c}
.prof-name{color:var(--head);font-size:22px;margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prof-about{background:#14213a;border-radius:8px;padding:10px 12px;margin-top:12px}
.prof-about h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;color:var(--muted)}
.prof-about p{overflow-wrap:anywhere}
.picker{position:fixed;z-index:60;background:var(--side);border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(8,36px);gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.picker button{width:36px;height:36px;font-size:22px;border-radius:4px}.picker button:hover{background:var(--active)}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0a1220;color:#fff;padding:10px 16px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.4);font-size:14px;animation:pop .15s}
.toast.bad{background:var(--red)}
#snow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:21}
.rail-item.home .icon{background:transparent;overflow:hidden}
.rail-item .icon img{width:48px;height:48px;display:block}
.side-head{background:linear-gradient(180deg,rgba(160,210,255,.07),transparent)}
.welcome .wicon{background:linear-gradient(135deg,#7fd8ff,#3d6bff)}
.box input[type=checkbox]{width:auto;margin-right:8px;transform:scale(1.2)}
.toggle{display:flex!important;align-items:center;font-size:15px!important;text-transform:none!important;color:var(--text)!important;cursor:pointer;font-weight:500!important}
.tabs{display:flex;gap:6px;align-items:center;overflow-x:auto;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tdiv{width:1px;height:24px;background:#2a3a55;margin:0 6px;flex-shrink:0}
.tab{padding:3px 10px;border-radius:4px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--hover);color:var(--text)}
.tab.on{background:var(--active);color:#fff}
.tab.add{background:var(--green);color:#fff}.tab.add.on{background:transparent;color:var(--green)}
.tab .tb{background:var(--red);color:#fff;border-radius:8px;font-size:11px;padding:0 5px;margin-left:4px;font-weight:700}
.friends{padding:8px 24px 24px}
.fhead{color:var(--head);font-size:16px;text-transform:uppercase;margin:8px 0 6px}
.addbox{display:flex;gap:8px;margin-top:14px;background:#0d1626;border:1px solid #2a3a55;border-radius:8px;padding:6px 6px 6px 12px;align-items:center}
.addbox:focus-within{border-color:var(--accent)}
.addbox input{flex:1;background:transparent;border:0;outline:none;font-size:16px;min-width:0}
.linkbox{background:linear-gradient(135deg,rgba(79,157,255,.18),rgba(127,216,255,.08));border:1px solid rgba(127,200,255,.3);border-radius:10px;padding:12px 14px;margin:8px 0 16px}
.linkbox b{color:var(--head)}
.link{flex:1;min-width:0;background:#0d1626;border-radius:6px;padding:8px 10px;font-family:Consolas,monospace;color:#9fdcff;overflow-wrap:anywhere;user-select:all}
.fmsg{margin-top:8px;font-size:14px;min-height:18px}.fmsg.ok{color:#4ade80}.fmsg.bad{color:#fa777c}
.fcat{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:20px 0 6px;padding-bottom:8px;border-bottom:1px solid #2a3a55}
.frow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;border-top:1px solid rgba(42,58,85,.6)}
.frow:hover{background:var(--hover)}
.finfo{flex:1;min-width:0}
.fname{font-weight:600;color:var(--head);display:flex;gap:6px;align-items:center}
.facts{display:flex;gap:8px}
.fbtn{width:36px;height:36px;border-radius:50%;background:#0d1626;color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center}
.fbtn:hover{background:#22314b}.fbtn.ok:hover{color:#4ade80}.fbtn.no:hover{color:#fa777c}
.frbadge{font-size:11px;font-weight:700;color:#4ade80;margin-left:6px}
#callbox{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:46;background:linear-gradient(180deg,#1d3156,#111d33);border:1px solid rgba(127,200,255,.35);border-radius:18px;padding:22px 34px 18px;box-shadow:0 16px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:250px;animation:pop .2s}
#callbox .cname{font-weight:800;font-size:18px;color:var(--head)}
#callbox .cstat{font-size:13px;color:var(--muted)}
#callbox .cb-av{border-radius:50%;animation:ring 1.2s infinite;margin-bottom:6px}
.cb-btns{display:flex;gap:28px;margin-top:12px}
.cbtn{width:52px;height:52px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;background:#2a3d5e;color:#fff;flex-shrink:0}
.cbtn:hover{filter:brightness(1.2)}
.cbtn.red{background:var(--red)}.cbtn.green{background:var(--green)}.cbtn.on{background:#e8eef7}
.hang span{display:inline-block;transform:rotate(135deg)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(47,191,113,.8)}70%{box-shadow:0 0 0 18px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
#callpanel{background:linear-gradient(180deg,#050a14,#0a1424);padding:30px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;border-bottom:1px solid #101b2e;flex-shrink:0;position:relative;z-index:22}
.cp-avs{display:flex;gap:56px;align-items:flex-start}
.cp-av{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.cp-av .av{transition:box-shadow .12s,opacity .3s;box-shadow:0 0 0 3px transparent}
.cp-av.talk .av{box-shadow:0 0 0 4px var(--green)}
.cp-av.wait .av{opacity:.45;animation:ring 1.4s infinite}
.cp-ico{position:absolute;top:58px;left:58px;background:var(--red);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;border:3px solid #050a14}
.cp-nm{font-weight:600;color:var(--head);font-size:14px}
.cp-stat{color:var(--muted);font-size:14px}.cp-stat.ok{color:#4ade80;font-weight:700}
.cp-btns{display:flex;gap:14px}
#voicebar{background:#0b1424;border-top:1px solid #1d2c47;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:2px;flex-shrink:0}
.vb-info{flex:1;min-width:0;cursor:pointer}
.vb-title{color:#4ade80;font-weight:700;font-size:13px}.vb-title.wait{color:var(--yellow)}
.vb-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn{width:32px;height:32px;border-radius:6px;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0}
.vbtn:hover{background:var(--hover)}.vbtn.on{background:rgba(229,72,77,.25)}.vbtn.red{color:#fa777c}
.logrow{padding:10px;border-radius:8px;background:#0f1a2e;margin-bottom:8px}
.loghead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logtext{margin-top:6px;color:var(--text);overflow-wrap:anywhere;white-space:pre-wrap;background:#0b1322;border-radius:6px;padding:6px 8px;font-size:14px}
.logimg{max-width:160px;max-height:120px;border-radius:6px;margin-top:6px;cursor:zoom-in}
.ctx{position:fixed;z-index:80;min-width:210px;background:rgba(12,16,32,.97);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.6);backdrop-filter:blur(14px);animation:pop .1s}
.ctx-it{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;color:#dfe5ff;text-align:left}
.ctx-it:hover{background:linear-gradient(135deg,#6d5dfc,#8b5cf6);color:#fff}
.ctx-it.danger{color:#ff6b81}.ctx-it.danger:hover{background:#e11d48;color:#fff}
.ctx-ic{font-size:14px;opacity:.9;width:18px;text-align:center}
.ctx-sep{height:1px;background:rgba(255,255,255,.08);margin:4px 6px}
.vchan.connected{color:#4ade80}
.vuser{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 34px;border-radius:8px;cursor:pointer;color:#c3cbe6;font-size:14px}
.vuser:hover{background:rgba(255,255,255,.05)}
.vuser .av{transition:box-shadow .12s}
.vuser.talk .av{box-shadow:0 0 0 2px #2ee59d}
.vuser .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vico{font-size:12px}
.vroom{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:26px;padding:40px 20px;text-align:center}
.vr-icon{font-size:40px;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;background:linear-gradient(135deg,#2ee6f5,#6d5dfc,#e14bd6);box-shadow:0 10px 30px rgba(109,93,252,.5)}
.vr-head h2{font-size:28px;font-weight:900;color:#fff}
.vr-head p{color:var(--muted);margin-top:4px}
.vgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:820px}
.vtile{width:190px;height:150px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--tile) 35%,transparent),rgba(255,255,255,.03));border:2px solid rgba(255,255,255,.08);transition:border-color .12s,box-shadow .12s}
.vtile.talk{border-color:#2ee59d;box-shadow:0 0 0 3px rgba(46,229,157,.25),0 0 30px rgba(46,229,157,.25)}
.vt-name{font-weight:700;color:#fff}
.vr-empty{font-size:64px;opacity:.6}
.vr-btns{display:flex;gap:14px}
.typepick{display:flex;flex-direction:column;gap:8px}
.tp{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);text-align:left}
.tp.on{background:rgba(124,108,255,.18);border-color:rgba(124,108,255,.6)}
.tp .tpi{font-size:22px;width:28px;text-align:center}
.tp b{display:block;color:#fff}.tp small{color:var(--muted)}
.tp .tpr{margin-left:auto;color:#a99cff;font-size:18px}
.badge-role.bot{background:linear-gradient(135deg,#2ee6f5,#6d5dfc);color:#fff}
.gw{margin-top:6px;max-width:460px;border-radius:16px;padding:16px 18px;background:linear-gradient(145deg,rgba(225,75,214,.22),rgba(109,93,252,.18) 50%,rgba(46,230,245,.12));border:1px solid rgba(225,75,214,.45);box-shadow:0 10px 30px rgba(225,75,214,.15)}
.gw.ended{filter:saturate(.6);border-color:rgba(255,255,255,.15)}
.gw.won{filter:none;border-color:#ffc857;box-shadow:0 0 0 3px rgba(255,200,87,.25),0 10px 30px rgba(255,200,87,.25)}
.gw-top{display:flex;justify-content:space-between;align-items:center}
.gw-tag{font-weight:900;letter-spacing:.12em;font-size:12px;background:linear-gradient(135deg,#ff9ff3,#ffc857);-webkit-background-clip:text;background-clip:text;color:transparent}
.gw-state{font-size:12px;font-weight:700;color:var(--muted)}.gw-state.live{color:#2ee59d}
.gw-prize{font-size:22px;font-weight:900;color:#fff;margin:6px 0 10px;overflow-wrap:anywhere}
.gw-info{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#dfe5ff}
.gw-win{margin-top:10px;font-weight:900;color:#ffc857;font-size:16px}
.gw-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fsel{width:100%;background:rgba(0,0,0,.35);color:var(--text);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;font:inherit}
.fsel option{background:#0d1426}
.botcard{border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.03)}
.botcard.on{border-color:rgba(124,108,255,.5);background:linear-gradient(145deg,rgba(124,108,255,.12),rgba(46,230,245,.05))}
.bc-head{display:flex;align-items:center;gap:12px}
.bc-av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,#2ee6f5,#6d5dfc,#e14bd6);flex-shrink:0}
.bc-t{flex:1;min-width:0}.bc-t b{display:block;color:#fff;font-size:16px}.bc-t small{color:var(--muted)}
.bc-head .trow{margin:0;padding:0;background:none}
.bc-body{margin-top:12px;padding-top:4px;border-top:1px solid rgba(255,255,255,.06)}
.bc-body h4{color:#fff;margin:16px 0 6px;font-size:14px}
.trow{display:flex!important;align-items:center;justify-content:space-between;gap:12px;padding:8px 0!important;margin:0!important;cursor:pointer;text-transform:none!important;letter-spacing:0!important}
.trow b{display:block;color:#e7ecff;font-size:14px}.trow small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:12px;background:rgba(255,255,255,.15);transition:background .2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+i{background:linear-gradient(135deg,#2ee59d,#14b8a6)}
.switch input:checked+i:after{transform:translateX(20px)}
.cmds{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#cfd6f5}
.cmds code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px;color:#a99cff}
.slash{background:rgba(12,16,32,.97);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px;margin-bottom:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sl-h{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px}
.sl-it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.sl-it:hover{background:rgba(124,108,255,.25)}
.sl-ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2ee6f5,#6d5dfc,#e14bd6);font-size:14px}
.sl-it b{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#0d1626;border:1px solid #2a3a55;border-radius:14px;padding:3px 6px 3px 10px;font-size:13px;display:flex;align-items:center;gap:4px}
.chip button{color:var(--muted);font-size:13px;padding:0 4px}.chip button:hover{color:#fa777c}
@media (min-width:1001px){#app.mem-hidden #members{display:none}}
@media (max-width:1000px){
  #members{position:fixed;right:0;top:0;bottom:0;z-index:30;transform:translateX(100%);transition:transform .2s;box-shadow:-4px 0 16px rgba(0,0,0,.4)}
  #app.mem-open #members{transform:none}
  #app.mem-open #backdrop{display:block}
}
@media (max-width:760px){
  .mobile-only{display:flex}
  #rail,#side{position:fixed;top:0;bottom:0;z-index:30;transition:transform .2s}
  #rail{left:0;transform:translateX(-320px)}
  #side{left:72px;transform:translateX(-320px)}
  #app.nav-open #rail,#app.nav-open #side{transform:none}
  #app.nav-open #backdrop{display:block}
  .msg{padding-right:12px}
  .mact{top:-30px}
  .msg:hover .mact{display:none}.msg.sel .mact{display:flex}
  .composer-wrap{padding:0 8px calc(env(safe-area-inset-bottom) + 4px)}
  #callpanel{padding:18px 10px 14px}
  .cp-avs{gap:28px}
  .cbtn{width:56px;height:56px}
  #callbox{top:70px;width:calc(100vw - 32px)}
  .friends{padding:8px 10px 24px}
  .chat-head{padding:0 6px}
  .box{padding:16px}
  .iconbtn{width:40px;height:40px}
  .fbtn{width:40px;height:40px}
}

/* ===================== FROSTBYTE 2.0 – POLARLICHT-DESIGN ===================== */
:root{--rail:rgba(6,9,20,.72);--side:rgba(11,16,32,.72);--chat:rgba(13,19,38,.66);--input:rgba(255,255,255,.06);--hover:rgba(255,255,255,.06);--active:rgba(124,108,255,.22);
  --text:#e7ecff;--head:#ffffff;--muted:#8e9bc2;--accent:#7c6cff;--green:#2ee59d;--red:#ff4d6d;--yellow:#ffc857;
  --grad:linear-gradient(135deg,#2ee6f5 0%,#6d5dfc 50%,#e14bd6 100%);--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.08)}
html{background:#03050c}
body{background:transparent!important}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;letter-spacing:.1px}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 15%,rgba(46,230,245,.38),transparent 70%),radial-gradient(35% 40% at 85% 20%,rgba(109,93,252,.45),transparent 70%),radial-gradient(45% 40% at 70% 95%,rgba(225,75,214,.34),transparent 70%),radial-gradient(30% 30% at 20% 85%,rgba(46,229,157,.2),transparent 70%);
  filter:blur(20px);animation:aurora 22s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(3%,-2%) rotate(4deg)}100%{transform:translate(-3%,2%) rotate(-3deg)}}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
/* schwebende Glas-Fenster */
#app{padding:10px;gap:10px;background:transparent}
#rail,#side,#main,#members{border-radius:18px;border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
#rail{background:var(--rail);padding:12px 0}
#side{background:var(--side);overflow:hidden}
#main{background:var(--chat);overflow:hidden}
#members{background:var(--side)}
.side-head,.chat-head{border-bottom:1px solid var(--line);background:transparent}
.side-head{height:56px;font-size:16px;font-weight:800}
.chat-head{height:56px}
.chat-head .title{font-size:16px;font-weight:800}
/* Server-Leiste */
.rail-item .icon{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:all .2s}
.rail-item:hover .icon{border-radius:14px;background:rgba(124,108,255,.35);transform:translateY(-1px)}
.rail-item.active .icon{background:var(--grad);border-color:transparent;box-shadow:0 6px 20px rgba(109,93,252,.55)}
.rail-item.home .icon{background:transparent;border:0;box-shadow:none}
.rail-item.home.active .icon{filter:drop-shadow(0 6px 16px rgba(109,93,252,.7))}
.rail-item .pill{background:var(--grad);width:4px}
.rail-item.add .icon{color:var(--green);background:rgba(46,229,157,.08)}
.rail-item.add:hover .icon{background:var(--green);color:#03150d}
.rail-item.adm:hover .icon{background:rgba(255,200,87,.3)}
.rail-sep{background:var(--line)}
.rail-item .badge{border-color:#060914;background:var(--red)}
/* Kanaele */
.cat{color:#7f8bb3;letter-spacing:.08em;font-size:11px}
.chan{border-radius:10px;padding:8px 10px;margin:2px 0;transition:background .15s}
.chan.active{background:linear-gradient(90deg,rgba(124,108,255,.35),rgba(124,108,255,.08));color:#fff;box-shadow:inset 3px 0 0 #8b7bff}
.chan .cnt{background:var(--grad)}
#userPanel{background:rgba(0,0,0,.25);border-top:1px solid var(--line);height:60px;padding:0 10px}
/* Avatare */
.av{box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.av .dot{border-color:#0b1020}
.av .dot.on{background:var(--green);box-shadow:0 0 8px rgba(46,229,157,.8)}
/* Nachrichten */
.msg{transition:background .12s}
.msg:hover,.msg.sel{background:rgba(255,255,255,.035)}
.mname{font-weight:700}
.mact{background:rgba(16,22,42,.95);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px)}
.welcome .wicon{background:var(--grad);box-shadow:0 10px 30px rgba(109,93,252,.45)}
.welcome h2{font-weight:900;background:linear-gradient(90deg,#fff,#c8d2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.daysep:before,.daysep:after{background:var(--line)}
.mention{background:rgba(124,108,255,.25);color:#cfc8ff}
.react{background:rgba(255,255,255,.05);border-radius:10px}
.react.mine{background:rgba(124,108,255,.22);border-color:#8b7bff}
/* Eingabe */
.composer{background:var(--input);border:1px solid var(--line);border-radius:14px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:rgba(124,108,255,.7);box-shadow:0 0 0 4px rgba(124,108,255,.15)}
#btnSend{background:var(--grad);color:#fff;border-radius:10px;width:38px;height:38px;margin:2px}
/* Knoepfe */
.btn{border-radius:10px;background:rgba(255,255,255,.1);font-weight:700}
.btn.primary{background:var(--grad);box-shadow:0 6px 18px rgba(109,93,252,.4)}
.btn.green{background:linear-gradient(135deg,#2ee59d,#14b8a6);color:#03150d;box-shadow:0 6px 18px rgba(46,229,157,.3)}
.btn.red{background:linear-gradient(135deg,#ff4d6d,#e11d48)}
.iconbtn{border-radius:10px}
/* Freunde-Seite */
.tab{border-radius:8px;font-weight:600}
.tab.on{background:rgba(124,108,255,.3)}
.tab.add{background:linear-gradient(135deg,#2ee59d,#14b8a6);color:#03150d;font-weight:800}
.tab.add.on{background:transparent;color:var(--green)}
.frow{border-top:1px solid var(--line);border-radius:12px}
.fbtn{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.addbox{background:rgba(0,0,0,.3);border-color:var(--line);border-radius:14px;padding:8px 8px 8px 14px}
.linkbox{background:linear-gradient(135deg,rgba(46,230,245,.12),rgba(225,75,214,.1));border-color:rgba(124,108,255,.35);border-radius:14px}
.link{background:rgba(0,0,0,.35)}
/* Fenster */
#modal{background:rgba(3,5,12,.6);backdrop-filter:blur(6px)}
.box{background:rgba(14,20,40,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.box input,.box textarea,.card input{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px}
.box input:focus,.box textarea:focus,.card input:focus{border-color:rgba(124,108,255,.7);outline:none}
.toast{background:rgba(16,22,42,.95);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px)}
.picker{background:rgba(14,20,40,.96);border:1px solid var(--line);border-radius:14px}
/* Login */
.auth{background:transparent}
.auth:after{display:none}
.card{background:rgba(12,18,36,.7);border:1px solid rgba(255,255,255,.12);border-radius:22px}
.card .logo img{width:96px;height:96px;filter:drop-shadow(0 10px 30px rgba(109,93,252,.7))}
.card .brand{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:36px;font-weight:900}
.btn.big{border-radius:12px}
/* Anrufe */
#callpanel{background:radial-gradient(60% 120% at 50% 0%,rgba(109,93,252,.35),transparent 70%),rgba(3,5,12,.55);border-bottom:1px solid var(--line)}
.cbtn{background:rgba(255,255,255,.1);border:1px solid var(--line)}
.cbtn.red{background:linear-gradient(135deg,#ff4d6d,#e11d48);border:0}
.cbtn.green{background:linear-gradient(135deg,#2ee59d,#14b8a6);border:0}
#callbox{background:rgba(14,20,40,.95);border-color:rgba(124,108,255,.4);border-radius:22px}
#voicebar{background:rgba(46,229,157,.06);border-top:1px solid var(--line)}
.mini-prof{background:rgba(0,0,0,.25);border-radius:14px}
.badge-role.owner{background:linear-gradient(135deg,#ffc857,#ff9f43);color:#1a1205}
.badge-role.admin{background:linear-gradient(135deg,#ff4d6d,#e11d48)}
@media (max-width:760px){#app{padding:0;gap:0}#rail,#side,#main,#members{border-radius:0;border:0}}

#ssettings{position:fixed;inset:0;z-index:45;background:rgba(3,5,12,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:pop .15s}
.ss-wrap{display:flex;height:100%}
.ss-nav{width:280px;flex-shrink:0;display:flex;justify-content:flex-end;background:rgba(10,14,28,.7);border-right:1px solid rgba(255,255,255,.06);overflow-y:auto}
.ss-nav-in{width:220px;padding:50px 10px 30px}
.ss-h{font-size:11px;font-weight:800;color:#8e9bc2;letter-spacing:.08em;text-transform:uppercase;padding:14px 10px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:#b9c3e3;font-weight:600;margin:1px 0}
.ss-item:hover{background:rgba(255,255,255,.06);color:#fff}
.ss-item.on{background:linear-gradient(90deg,rgba(124,108,255,.4),rgba(124,108,255,.12));color:#fff}
.ss-ic{width:20px;text-align:center}
.ss-main{flex:1;overflow-y:auto;position:relative}
.ss-content{max-width:760px;padding:50px 40px 120px}
.ss-closebox{position:fixed;top:44px;right:40px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8e9bc2;font-size:11px;font-weight:700}
.ss-close{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.3);color:#fff;font-size:16px}

<body>
<div id="auth" class="auth hidden">
  <form class="card" id="authForm" autocomplete="on">
    <div class="logo"><img src="/logo.svg" alt=""></div>
    <div class="brand">__APP_NAME__</div>
    <h1 id="authTitle">Willkommen zurück!</h1>
    <p class="sub" id="authSub">Schön, dass du wieder da bist! ❄️</p>
    <label for="aName">Benutzername</label>
    <input id="aName" maxlength="20" autocomplete="username" required>
    <label for="aPass">Passwort</label>
    <input id="aPass" type="password" maxlength="200" autocomplete="current-password" required>
    <div id="aPass2Wrap" class="hidden">
      <label for="aPass2">Passwort wiederholen</label>
      <input id="aPass2" type="password" maxlength="200" autocomplete="new-password">
    </div>
    <div class="err" id="authErr"></div>
    <button class="btn primary big" id="authBtn" type="submit">Einloggen</button>
    <p class="switch"><span id="authSwitchText">Noch kein Konto?</span> <a href="#" id="authSwitch">Registrieren</a></p>
    <p class="hint">❄️ Keine E-Mail nötig – nur Name und Passwort.</p>
  </form>
</div>

<div id="app" class="hidden">
  <nav id="rail"></nav>
  <aside id="side">
    <div id="sideHead" class="side-head"></div>
    <div id="chanList"></div>
    <div id="voicebar" class="hidden"></div>
    <div id="userPanel"></div>
  </aside>
  <main id="main">
    <div id="chatHead" class="chat-head"></div>
    <div id="callpanel" class="hidden"></div>
    <div id="conn" class="conn hidden">Verbindung verloren – verbinde neu …</div>
    <div id="msgs"></div>
    <div id="composerWrap" class="composer-wrap">
      <div id="slash" class="slash hidden"></div>
      <div id="replybar" class="replybar hidden"></div>
      <div id="preview" class="preview hidden"></div>
      <div class="composer">
        <button type="button" class="iconbtn" id="btnImg" title="Bild senden">🖼️</button>
        <textarea id="input" rows="1" maxlength="2000" placeholder="Nachricht"></textarea>
        <button type="button" class="iconbtn" id="btnEmoji" title="Emoji">😀</button>
        <button type="button" class="iconbtn" id="btnSend" title="Senden">➤</button>
      </div>
      <input type="file" id="fileIn" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    </div>
    <div id="typing"></div>
  </main>
  <aside id="members"></aside>
  <div id="backdrop"></div>
</div>
<div id="ssettings" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toasts"></div>
<canvas id="snow"></canvas>
<div id="callbox" class="hidden"></div>

<script>
(function () {
'use strict';
var APP = document.title;
var S = { token: null, me: null, users: {}, servers: {}, dms: {}, main: null, emojis: [], colors: [],

  es: null, opened: false, publicUrl: '', badWords: [], fr: { friends: [], incoming: [], outgoing: [] }, friendTab: 'online', editing: null, editText: '', pendingImage: null, stick: true, hiddenCount: 0, lastTyping: 0 };

// ---------- Helfer ----------
function $(id) { return document.getElementById(id); }

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function fmtTime(ts) {
  var d = new Date(ts), n = new Date(), y = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1);
  if (dayKey(ts) === dayKey(n)) return 'Heute um ' + hhmm(ts);

}
function fmtDay(ts) { return new Date(ts).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function fmtDate(ts) { return new Date(ts).toLocaleDateString('de-DE'); }
function toast(msg, bad) { var t = el('div', { class: 'toast' + (bad ? ' bad' : '') }, msg); $('toasts').append(t); setTimeout(function () { t.remove(); }, 3500); }

  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Kopiert ✓'); }, function () { toast('Code: ' + text); });

}
function isMod() { return S.me && (S.me.role === 'owner' || S.me.role === 'admin'); }
function perm(s, p) {
  if (!s || !S.me) return false;
  if (s.ownerId === S.me.id || isMod()) return true;
  return ((s.memberRoles || {})[S.me.id] || []).some(function (rid) {
    var r = (s.roles || []).filter(function (x) { return x.id === rid; })[0];
    return r && (r.perms.indexOf('admin') >= 0 || r.perms.indexOf(p) >= 0);
  });
}
function canManage(s) { return ['manageServer', 'manageChannels', 'manageRoles', 'kick', 'ban', 'giveaway'].some(function (p) { return perm(s, p); }); }
function rolesOf(s, uid) {
  if (!s) return [];
  var ids = (s.memberRoles || {})[uid] || [];
  return (s.roles || []).filter(function (r) { return ids.indexOf(r.id) >= 0; });
}
function nameColor(s, u) { var r = rolesOf(s, u.id).filter(function (r) { return r.color; })[0]; return r ? r.color : u.color; }
function curServer() { return S.view.server && S.view.server !== 'dm' ? S.servers[S.view.server] : null; }
function dmPartner(dm) { var id = dm.users.filter(function (x) { return x !== S.me.id; })[0] || S.me.id; return S.users[id] || { id: id, name: 'Unbekannt', color: '#6f84a3', role: 'user' }; }
function sortedDms() { return Object.values(S.dms).sort(function (a, b) { return (b.last || 0) - (a.last || 0); }); }
function rank(u) { return u.role === 'owner' ? 0 : u.role === 'admin' ? 1 : 2; }
function cmpUser(a, b) { return rank(a) - rank(b) || a.name.localeCompare(b.name); }
function userByName(n) { var l = n.toLowerCase(); for (var id in S.users) if (S.users[id].name.toLowerCase() === l) return S.users[id]; return null; }
function resolveMention(n) { var tail = ''; while (n.length) { var u = userByName(n); if (u) return [u, tail]; if (n.slice(-1) !== '.' && n.slice(-1) !== '-') break; tail = n.slice(-1) + tail; n = n.slice(0, -1); } return null; }
function mentionsMe(text) {
  if (!text || !S.me) return false;
  var re = new RegExp(MENTION_SRC, 'g'), x;
  while ((x = re.exec(text))) { var r = resolveMention(x[1]); if (r && r[0].id === S.me.id) return true; }
  return false;
}
function fmt(text) {
  var t = esc(text);
  t = t.replace(/\x60([^\x60\n]+)\x60/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<i>$2</i>');
  t = t.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');
  t = t.replace(new RegExp(MENTION_SRC, 'g'), function (m, n) {
    var r = resolveMention(n); if (!r) return m;
    return '<span class="mention' + (r[0].id === S.me.id ? ' me' : '') + '">@' + esc(r[0].name) + '</span>' + r[1];
  });
  t = t.replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>'; });
  return t.replace(/\n/g, '<br>');
}
function avatar(u, size, onclick, dot, cls) {
  var pic = u.avatar && /^\/uploads\/[a-f0-9]{16}\.(png|jpg|gif|webp)$/.test(u.avatar);
  var bg = u.bot ? 'linear-gradient(135deg,#2ee6f5,#6d5dfc,#e14bd6)' : pic ? 'url(' + u.avatar + ') center/cover no-repeat, ' + u.color : u.color;
  return el('div', { class: 'av' + (cls ? ' ' + cls : ''), title: u.name,
    style: 'width:' + size + 'px;height:' + size + 'px;background:' + bg + ';font-size:' + Math.round(size * (u.bot ? 0.5 : 0.42)) + 'px;' + (onclick ? 'cursor:pointer' : ''),
    onclick: onclick || null }, u.bot ? u.icon : pic ? '' : (u.name || '?').charAt(0), dot ? el('span', { class: 'dot' + (u.online ? ' on' : '') }) : null);
}
var BOTS = {
  'bot:giveaway': { id: 'bot:giveaway', name: 'Giveaway-Bot', color: '#e14bd6', role: 'bot', bot: true, icon: '🎉' },
  'bot:galaxy': { id: 'bot:galaxy', name: 'Galaxy-Bot', color: '#8b7bff', role: 'bot', bot: true, icon: '🌌' }
};
function userOf(id) { return S.users[id] || BOTS[id] || { id: id, name: 'Unbekannt', color: '#6f84a3', role: 'user' }; }
function roleBadge(u) {
  if (u.role === 'bot') return el('span', { class: 'badge-role bot' }, '✓ Bot');
  if (u.role === 'owner') return el('span', { class: 'badge-role owner' }, 'Owner');
  if (u.role === 'admin') return el('span', { class: 'badge-role admin' }, 'Admin');
  return null;
}
var actx = null;

    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;

}

// ---------- Server-Verbindung ----------
async function api(path, body) {
  var opt = { method: body === undefined ? 'GET' : 'POST', headers: {} };

  return d;
}
async function loadState() {
  var d = await api('/api/state');
  S.me = d.me; S.main = d.mainServer; S.emojis = d.emojis; S.colors = d.colors;
  S.users = {}; d.users.forEach(function (u) { S.users[u.id] = u; });
  S.servers = {}; d.servers.forEach(function (s) { S.servers[s.id] = s; });
  S.dms = {}; d.dms.forEach(function (x) { S.dms[x.id] = x; });
  S.fr = d.friends || { friends: [], incoming: [], outgoing: [] };
  S.publicUrl = d.publicUrl || '';
  S.badWords = d.badWords || [];
  S.lan = d.lan || [];
  S.voiceSt = d.voice || {};
  S.gws = {}; (d.giveaways || []).forEach(function (g) { S.gws[g.id] = g; });
  if (S.version && d.version && S.version !== d.version) { location.reload(); return; }

  APP = d.app;
}
function connect() {
  if (S.es) S.es.close();
  S.opened = false;
  var es = new EventSource('/api/events?token=' + encodeURIComponent(S.token));

  es.onopen = function () { if (S.opened) resync(); S.opened = true; $('conn').classList.add('hidden'); };

async function resync() {
  try {
    await loadState(); S.msgs = {};
    if (S.view.server !== 'dm' && !S.servers[S.view.server]) return selectServer(S.main);

  } catch (e) {}
}
async function loadMessages(ch) {
  try {
    var d = await api('/api/messages?channel=' + encodeURIComponent(ch));
    S.msgs[ch] = d.messages;
    if (ch === S.view.channel) { S.stick = true; renderMessages(); }
  } catch (e) { toast(e.message, true); }
}
function handle(type, d) {
  var list, i;
  switch (type) {
    case 'message': {
      var m = d.message; if (d.dm) S.dms[d.dm.id] = d.dm;
      list = S.msgs[m.channel];
      if (list && !list.some(function (x) { return x.id === m.id; })) list.push(m);
      if (S.typing[m.channel]) delete S.typing[m.channel][m.userId];
      var mine = m.userId === S.me.id, here = m.channel === S.view.channel;
      if (mine) S.stick = true;
      if (!mine && (!here || document.hidden)) {

        if (document.hidden) S.hiddenCount++;

      break;

      break;

function snowStart() {
  var c = $('snow'), ctx = c.getContext('2d');
  function size() { var d = window.devicePixelRatio || 1; c.width = innerWidth * d; c.height = innerHeight * d; }
  size(); window.addEventListener('resize', size);
  function flake(any) { return { x: Math.random(), y: any ? Math.random() : -0.03, r: 0.8 + Math.random() * 2.4, s: 0.0007 + Math.random() * 0.0013, w: Math.random() * 6.28, o: 0.3 + Math.random() * 0.6 }; }

    var W = c.width, H = c.height, d = window.devicePixelRatio || 1, op = login ? 1 : 0.55;

    }
  }
  frame();
}

function wordFilterBox() {

  async function call(name, mode) {

    catch (e) { err.textContent = e.message; }

    el('p', { class: 'small' }, 'Rassistische Wörter und schlimme Beleidigungen sind schon eingebaut und werden immer geblockt (auch mit Tricks wie N3g… oder Leerzeichen). Wer 3x in 10 Min. beleidigt, ist 5 Min. stumm. Hier kannst du eigene Wörter dazu tun:'),
    el('div', { class: 'row' }, inp3, el('button', { class: 'btn red', onclick: function () { if (inp3.value.trim()) call(inp3.value.trim(), 'add'); } }, 'Verbieten')), err,
    el('div', { class: 'chips' }, S.badWords.length ? S.badWords.map(function (w) {
      return el('span', { class: 'chip' }, w, el('button', { title: 'Wieder erlauben', onclick: function () { call(w, 'remove'); } }, '✕'));
    }) : el('span', { class: 'small muted' }, 'Noch keine eigenen Wörter.')));
  return box;
}
function openSettings() {
  var color = S.me.color;
  var sw = el('div', { class: 'swatches' });
  var preview = avatar(S.me, 56);
  var colorMsg = el('div', { class: 'fmsg' });
  var saveTimer = null;
  function saveColor() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function () {
      try { var d = await api('/api/profile', { color: color }); d.user.online = true; S.users[d.user.id] = d.user; S.me = d.user; renderSide(); renderMembers(); renderMessages(); colorMsg.className = 'fmsg ok'; colorMsg.textContent = '✓ Farbe gespeichert'; }
      catch (e) { colorMsg.className = 'fmsg bad'; colorMsg.textContent = e.message; }
    }, 250);
  }
  function pick(c) { color = c; picker.value = c; if (!S.me.avatar) preview.style.background = c; drawSw(); saveColor(); }
  var picker = el('input', { type: 'color', class: 'colorpick', title: 'Eigene Farbe', value: color });
  picker.oninput = function () { pick(picker.value); };
  function drawSw() {
    sw.textContent = '';
    S.colors.forEach(function (c) { sw.append(el('button', { class: 'sw' + (c === color ? ' sel' : ''), style: 'background:' + c, title: c, onclick: function () { pick(c); } })); });
    sw.append(picker);
  }
  drawSw();
  var about = el('textarea', { rows: 3, maxlength: 190, placeholder: 'Erzähl was über dich …' }); about.value = S.me.about || '';
  var err1 = el('div', { class: 'err' }), err2 = el('div', { class: 'err' });
  var old = el('input', { type: 'password', autocomplete: 'current-password' }), nw = el('input', { type: 'password', autocomplete: 'new-password' }), nw2 = el('input', { type: 'password', autocomplete: 'new-password' });
  var picIn = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp', style: 'display:none' });
  var picMsg = el('div', { class: 'fmsg' });
  function setPreview() { var np = avatar(S.me, 56); preview.replaceWith(np); preview = np; }
  picIn.onchange = function () {
    var f = picIn.files[0]; picIn.value = ''; if (!f) return;
    if (!/^image\//.test(f.type)) { picMsg.className = 'fmsg bad'; picMsg.textContent = 'Nur Bilder!'; return; }
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = async function () {
      var c = document.createElement('canvas'), z = 256; c.width = z; c.height = z;
      var m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, z, z);
      URL.revokeObjectURL(url);
      var data = c.toDataURL('image/webp', 0.9); if (data.indexOf('data:image/webp') !== 0) data = c.toDataURL('image/png');
      try { var d = await api('/api/profile/avatar', { image: data }); d.user.online = true; S.users[d.user.id] = d.user; S.me = d.user; setPreview(); renderAll(); picMsg.className = 'fmsg ok'; picMsg.textContent = '✓ Profilbild gespeichert'; }
      catch (e) { picMsg.className = 'fmsg bad'; picMsg.textContent = e.message; }
    };
    img.onerror = function () { picMsg.className = 'fmsg bad'; picMsg.textContent = 'Das Bild konnte nicht geladen werden'; };
    img.src = url;
  };
  modal('Einstellungen', el('div', {},
    el('div', { class: 'row', style: 'margin-top:0' }, preview, el('div', {}, el('div', { class: 'prof-name', style: 'margin:0' }, S.me.name, roleBadge(S.me)), el('div', { class: 'muted small' }, 'Dabei seit ' + fmtDate(S.me.created)))),
    el('h3', {}, '🖼️ Profilbild'),
    el('div', { class: 'row', style: 'margin-top:0' }, picIn,
      el('button', { class: 'btn primary', onclick: function () { picIn.click(); } }, '🖼️ Bild auswählen'),
      el('button', { class: 'btn', onclick: async function () {
        try { var d = await api('/api/profile/avatar', { image: '' }); d.user.online = true; S.users[d.user.id] = d.user; S.me = d.user; setPreview(); renderAll(); picMsg.className = 'fmsg ok'; picMsg.textContent = 'Profilbild entfernt'; }
        catch (e) { picMsg.className = 'fmsg bad'; picMsg.textContent = e.message; } } }, 'Entfernen')), picMsg,
    el('h3', {}, '🎨 Profilfarbe'), el('p', { class: 'small muted', style: 'margin-bottom:8px' }, 'Klick auf eine Farbe – sie wird sofort gespeichert.'), sw, colorMsg,
    el('label', {}, 'Über mich'), about,
    el('div', { class: 'row' }, el('button', { class: 'btn primary', onclick: async function () {
      try { var d = await api('/api/profile', { color: color, about: about.value }); d.user.online = true; S.users[d.user.id] = d.user; S.me = d.user; renderSide(); renderMembers(); err1.className = 'fmsg ok'; err1.textContent = '✓ „Über mich“ gespeichert – andere sehen es, wenn sie auf deinen Namen klicken.'; }
      catch (e) { err1.className = 'fmsg bad'; err1.textContent = e.message; } } }, 'Über mich speichern')), err1,
    el('hr'), el('h3', {}, '🔑 Passwort ändern'),
    el('label', {}, 'Altes Passwort'), old, el('label', {}, 'Neues Passwort'), nw, el('label', {}, 'Neues Passwort wiederholen'), nw2,
    el('div', { class: 'row' }, el('button', { class: 'btn primary', onclick: async function () {
      if (nw.value !== nw2.value) { err2.textContent = 'Die neuen Passwörter stimmen nicht überein'; return; }
      try { await api('/api/password', { old: old.value, password: nw.value }); toast('Passwort geändert ✓'); old.value = nw.value = nw2.value = ''; err2.textContent = ''; }
      catch (e) { err2.textContent = e.message; } } }, 'Passwort ändern')), err2,
    el('hr'), el('h3', {}, '❄️ Winter'),
    el('label', { class: 'toggle' }, el('input', { type: 'checkbox', checked: snow.on, onchange: function (e) { snow.on = e.target.checked; try { localStorage.setItem('fb_snow', snow.on ? '1' : '0'); } catch (x) {} } }), 'Schneefall anzeigen'),
    el('hr'), el('button', { class: 'btn red', onclick: logout }, '🚪 Ausloggen'),
    S.me.role === 'owner' ? el('div', {}, el('hr'), el('h3', {}, '⏻ Frostbyte-Server'),
      el('p', { class: 'small' }, 'Frostbyte läuft unsichtbar im Hintergrund weiter, auch wenn du dieses Fenster schließt – damit deine Freunde weiter chatten können. Hier kannst du es ganz ausmachen. Zum Starten einfach wieder Frostbyte.exe öffnen.'),
      el('button', { class: 'btn red', style: 'margin-top:8px', onclick: function () {
        confirmBox('Frostbyte ganz beenden? Dann kann niemand mehr chatten, bis du es wieder startest.', 'Beenden', async function () {
          await api('/api/admin/shutdown', {});
          if (S.es) { S.es.close(); S.es = null; }
          setTimeout(function () { document.body.innerHTML = '<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#dfeaf8;font-family:sans-serif;background:#0b1322"><img src="data:," style="display:none"><div style="font-size:48px">❄️</div><div style="font-size:20px;font-weight:700">Frostbyte wurde beendet</div><div style="color:#8aa0bf">Du kannst dieses Fenster jetzt schließen.</div></div>'; }, 300);
        });
      } }, '⏻ Frostbyte beenden')) : null));
}

$('authSwitch').onclick = function (e) { e.preventDefault(); setAuthMode(authMode === 'login' ? 'register' : 'login'); $('aName').focus(); };
$('authForm').onsubmit = async function (e) {
  e.preventDefault();
  var name = $('aName').value.trim(), pw = $('aPass').value;
  if (authMode === 'register' && pw !== $('aPass2').value) { $('authErr').textContent = 'Die Passwörter stimmen nicht überein'; return; }
  $('authBtn').disabled = true;
  try {
    var d = await api(authMode === 'login' ? '/api/login' : '/api/register', { name: name, password: pw });
    S.token = d.token; try { localStorage.setItem('mc_token', d.token); } catch (x) {}
    $('aPass').value = ''; $('aPass2').value = '';
    await start();
  } catch (err) { $('authErr').textContent = err.message; }
  $('authBtn').disabled = false;
};
var inp = $('input');
inp.addEventListener('keydown', function (e) {
  if (e.key === 'Tab' && $('slash') && !$('slash').classList.contains('hidden')) { e.preventDefault(); var f = $('slash').querySelector('.sl-it'); if (f) f.click(); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
  else if (e.key === 'ArrowUp' && !inp.value) {
    var list = S.msgs[S.view.channel] || [];
    for (var i = list.length - 1; i >= 0; i--) if (list[i].userId === S.me.id && list[i].text) { e.preventDefault(); startEdit(list[i]); break; }
  }
});
inp.addEventListener('input', function () {
  autoGrow(); updateSlash();
  var t = Date.now();
  if (inp.value && S.view.channel && t - S.lastTyping > 3000) { S.lastTyping = t; api('/api/typing', { channel: S.view.channel }).catch(function () {}); }
});
inp.addEventListener('paste', function (e) {
  var f = e.clipboardData && e.clipboardData.files;
  if (f && f.length && f[0].type.indexOf('image/') === 0) { e.preventDefault(); setImage(f[0]); }
});
$('btnSend').onclick = sendMsg;
$('btnImg').onclick = function () { $('fileIn').click(); };
$('fileIn').onchange = function (e) { setImage(e.target.files[0]); e.target.value = ''; };
$('btnEmoji').onclick = function (e) { e.stopPropagation(); emojiPicker(e.currentTarget, function (x) { insertAtCursor(inp, x); }); };
$('backdrop').onclick = function () { $('app').classList.remove('nav-open', 'mem-open'); };
$('msgs').addEventListener('scroll', function () { var b = $('msgs'); S.stick = b.scrollHeight - b.scrollTop - b.clientHeight < 60; });
$('main').addEventListener('dragover', function (e) { e.preventDefault(); });
$('main').addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer.files.length && S.view.channel) setImage(e.dataTransfer.files[0]); });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  closePicker(); closeCtx();
  if (!$('modal').classList.contains('hidden')) closeModal();
  else if (SS) closeSS();
  else if (S.replyTo) cancelReply();
  else if (S.editing) { S.editing = null; renderMessages(); }
});
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { S.hiddenCount = 0; if (S.view.channel) S.unread[S.view.channel] = 0; updateTitle(); renderRail(); renderSide(); }
});
setInterval(renderTyping, 1000);
snowStart();
if (S.token) start(); else showAuth();
})();
