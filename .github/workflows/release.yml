name: Frostbyte bauen und veroeffentlichen

# Bei jedem Hochladen: Ist die Version in main.go neu, wird automatisch
# die Frostbyte.exe gebaut und als neue Version veroeffentlicht.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: v
        run: |
          V=$(grep -oP 'Version\s*=\s*"\K[0-9]+' main.go)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            echo "Version v$V gibt es schon - nichts zu tun."
            echo "exists=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.v.outputs.exists != '1'
        with:
          go-version: "1.24"
      - name: Test
        if: steps.v.outputs.exists != '1'
        run: go test ./...
      - name: Windows-App bauen
        if: steps.v.outputs.exists != '1'
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o Frostbyte.exe .
      - name: Version veroeffentlichen
        if: steps.v.outputs.exists != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Frostbyte ${{ steps.v.outputs.tag }}
          body_path: CHANGES.md
          files: Frostbyte.exe
          make_latest: true

  website:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neueste Version in die Webseite schreiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,name,publishedAt,body,assets > rel.json
          python3 - <<'PY'
          import json
          r = json.load(open('rel.json'))
          a = next((x for x in r.get('assets', []) if x['name'] == 'Frostbyte.exe'), None)
          json.dump({'version': r['tagName'], 'name': r['name'], 'date': r['publishedAt'], 'notes': r['body'],
                     'size': a['size'] if a else 0,
                     'url': 'https://github.com/' + __import__('os').environ['GITHUB_REPOSITORY'] + '/releases/download/' + r['tagName'] + '/Frostbyte.exe'},
                    open('docs/version.json', 'w'), ensure_ascii=False)
          PY
          touch docs/.nojekyll
      - name: Webseite veroeffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./docs
          publish_branch: gh-pages
